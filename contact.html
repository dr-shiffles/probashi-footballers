<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Probashi-Footballers.com</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="scripts/layout.js"></script>

    <div class="container">
        <div class="contact-wrapper">
            <div class="contact-header">
                <h1>Contact Us</h1>
            </div>

            <div class="contact-grid">
                <div class="contact-form-container">
                    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScZIMu409IVyMB1_tCOPkLvj9ZE-DZxYDPggbZDuHDQjn6lZA/viewform?embedded=true" width="100%" height="850" frameborder="0">Loading…</iframe>
                </div>

                <div class="contact-info">
                    <h3><i class="fas fa-info-circle"></i> Why reach out?</h3>
                    <div class="info-item">
                        <i class="fas fa-futbol"></i>
                        <p>Know a Bangladeshi-origin player we missed? Submit their details!</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-sync-alt"></i>
                        <p>Spot outdated info? Let us know and help keep the database accurate.</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-question-circle"></i>
                        <p>General questions, collaborations, or feedback — we'd love to hear from you.</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <p>Email us directly at:<br><a href="mailto:contact@probashi-footballers.com">contact@probashi-footballers.com</a></p>
                    </div>
                </div>
            </div>
        </div>

        <footer></footer>
    </div>

</body>
</html>
