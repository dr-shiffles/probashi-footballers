name: Update Last Update Timestamp

on:
  push:
    paths:
      - 'data/mens.csv'
      - 'data/women.csv'
    branches:
      - main

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Important: fetch all history to get proper timestamps

      - name: Get commit timestamps
        id: get_timestamps
        run: |
          # Get timestamp for mens.csv
          MEN_TIMESTAMP=$(git log -1 --format=%ct -- data/mens.csv 2>/dev/null || echo "")
          # Get timestamp for women.csv
          WOMEN_TIMESTAMP=$(git log -1 --format=%ct -- data/women.csv 2>/dev/null || echo "")

          # Convert to ISO format
          if [ -n "$MEN_TIMESTAMP" ]; then
            MEN_ISO=$(date -d "@$MEN_TIMESTAMP" -Iseconds)
          else
            MEN_ISO=""
          fi

          if [ -n "$WOMEN_TIMESTAMP" ]; then
            WOMEN_ISO=$(date -d "@$WOMEN_TIMESTAMP" -Iseconds)
          else
            WOMEN_ISO=""
          fi

          # Get the latest of the two
          if [ -n "$MEN_TIMESTAMP" ] && [ -n "$WOMEN_TIMESTAMP" ]; then
            if [ "$MEN_TIMESTAMP" -gt "$WOMEN_TIMESTAMP" ]; then
              LATEST_ISO="$MEN_ISO"
            else
              LATEST_ISO="$WOMEN_ISO"
            fi
          elif [ -n "$MEN_TIMESTAMP" ]; then
            LATEST_ISO="$MEN_ISO"
          elif [ -n "$WOMEN_TIMESTAMP" ]; then
            LATEST_ISO="$WOMEN_ISO"
          else
            LATEST_ISO=$(date -Iseconds)
          fi

          echo "MEN_ISO=$MEN_ISO" >> $GITHUB_OUTPUT
          echo "WOMEN_ISO=$WOMEN_ISO" >> $GITHUB_OUTPUT
          echo "LATEST_ISO=$LATEST_ISO" >> $GITHUB_OUTPUT

      - name: Count players
        id: count_players
        run: |
          MEN_COUNT=0
          WOMEN_COUNT=0

          if [ -f "data/mens.csv" ]; then
            MEN_COUNT=$(tail -n +2 data/mens.csv | grep -c '^' || echo 0)
          fi

          if [ -f "data/women.csv" ]; then
            WOMEN_COUNT=$(tail -n +2 data/women.csv | grep -c '^' || echo 0)
          fi

          echo "MEN_COUNT=$MEN_COUNT" >> $GITHUB_OUTPUT
          echo "WOMEN_COUNT=$WOMEN_COUNT" >> $GITHUB_OUTPUT

      - name: Create lastUpdate.json
        run: |
          cat > data/lastUpdate.json << EOF
          {
            "lastUpdate": "${{ steps.get_timestamps.outputs.LATEST_ISO }}",
            "menLastUpdate": "${{ steps.get_timestamps.outputs.MEN_ISO }}",
            "womenLastUpdate": "${{ steps.get_timestamps.outputs.WOMEN_ISO }}",
            "menCount": ${{ steps.count_players.outputs.MEN_COUNT }},
            "womenCount": ${{ steps.count_players.outputs.WOMEN_COUNT }}
          }
          EOF

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the file
          git add data/lastUpdate.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit the changes
          git commit -m "chore: update lastUpdate.json timestamp"
          
          # Push with retry logic
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            
            if git push; then
              echo "Push successful!"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Push failed. Pulling latest changes..."
                git pull --rebase
                echo "Waiting before retry..."
                sleep 5
              fi
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
