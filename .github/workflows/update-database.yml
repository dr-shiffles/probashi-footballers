name: Update Database Automatically

on:
  push:
    paths:
      - 'data/women.csv'
      - 'data/mens.csv'
    branches:
      - main
      - master

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: List files for debugging
        run: |
          echo "Repository structure:"
          ls -la
          echo "Data directory:"
          ls -la data/ || echo "data/ directory not found"
      
      - name: Run update script
        run: |
          python .github/scripts/update_csv.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Only add files that actually exist
          if [ -f "data/women.csv" ]; then git add data/women.csv; fi
          if [ -f "data/mens.csv" ]; then git add data/mens.csv; fi
          git diff --staged --quiet || (git commit -m "Auto-update: age and sorting string columns" && git push)