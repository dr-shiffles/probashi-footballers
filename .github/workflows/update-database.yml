name: Automatic Age & Sorting String Update

on:
  push:
    paths:
      - 'data/women.csv'
      - 'data/mens.csv'
    branches:
      - main
      
jobs:
  update-database:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Run update script
        run: |
          python .github/scripts/update_csv.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add women.csv men.csv
          git diff --staged --quiet || (git commit -m "Auto-update: age and sorting string columns" && git push)
